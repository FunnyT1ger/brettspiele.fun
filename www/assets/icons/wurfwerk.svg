<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="d1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="d2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <filter id="sha" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <filter id="shb" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>
  <!-- Back die (upper right, 4 pips) -->
  <rect x="86" y="14" width="98" height="98" rx="20" fill="url(#d2)" filter="url(#sha)" opacity=".88"/>
  <rect x="86" y="14" width="98" height="98" rx="20" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="2"/>
  <circle cx="115" cy="44" r="8" fill="rgba(0,0,0,.28)"/>
  <circle cx="155" cy="44" r="8" fill="rgba(0,0,0,.28)"/>
  <circle cx="115" cy="84" r="8" fill="rgba(0,0,0,.28)"/>
  <circle cx="155" cy="84" r="8" fill="rgba(0,0,0,.28)"/>
  <!-- Front die (lower left, 5 pips) -->
  <rect x="16" y="88" width="112" height="112" rx="22" fill="url(#d1)" filter="url(#shb)"/>
  <rect x="16" y="88" width="112" height="112" rx="22" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2.5"/>
  <circle cx="46" cy="118" r="9" fill="rgba(0,0,0,.26)"/>
  <circle cx="102" cy="118" r="9" fill="rgba(0,0,0,.26)"/>
  <circle cx="74" cy="144" r="9" fill="rgba(0,0,0,.26)"/>
  <circle cx="46" cy="170" r="9" fill="rgba(0,0,0,.26)"/>
  <circle cx="102" cy="170" r="9" fill="rgba(0,0,0,.26)"/>
  <!-- Sheen on front die -->
  <path d="M16 110 Q16 88 38 88 L128 88 L16 140 Z" fill="rgba(255,255,255,.1)"/>
</svg>
