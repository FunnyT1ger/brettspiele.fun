<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5e190"/>
      <stop offset="0.5" stop-color="#d6aa4d"/>
      <stop offset="1" stop-color="#7a5a12"/>
    </linearGradient>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e0" stop-opacity=".5"/>
      <stop offset="1" stop-color="#d6aa4d" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <!-- Shield body -->
  <path d="M18 16 L182 16 L182 122 Q182 192 100 214 Q18 192 18 122 Z"
        fill="url(#g)" filter="url(#sh)"/>
  <!-- Sheen overlay -->
  <path d="M18 16 L182 16 L182 90 Q130 50 18 80 Z" fill="url(#gg)" opacity=".6"/>
  <!-- Inner border -->
  <path d="M30 28 L170 28 L170 122 Q170 183 100 202 Q30 183 30 122 Z"
        fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2.5"/>
  <!-- Horizontal divider -->
  <line x1="38" y1="110" x2="162" y2="110" stroke="rgba(0,0,0,.18)" stroke-width="3"/>
  <!-- Vertical divider -->
  <line x1="100" y1="40" x2="100" y2="185" stroke="rgba(0,0,0,.18)" stroke-width="3"/>
  <!-- Territory dots -->
  <circle cx="66" cy="80" r="6" fill="rgba(0,0,0,.2)"/>
  <circle cx="134" cy="80" r="6" fill="rgba(0,0,0,.2)"/>
  <circle cx="66" cy="140" r="6" fill="rgba(0,0,0,.2)"/>
  <circle cx="134" cy="140" r="6" fill="rgba(0,0,0,.2)"/>
  <!-- Center gem -->
  <polygon points="100,100 112,116 100,122 88,116" fill="rgba(255,255,255,.45)"/>
  <polygon points="100,100 112,116 100,108" fill="rgba(255,255,255,.22)"/>
</svg>
