<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-label="LevelUp">
  <defs>
    <linearGradient id="luBg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1d4d43"/><stop offset="1" stop-color="#0a1a17"/>
    </linearGradient>
    <linearGradient id="luCardR" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff8a7a"/><stop offset="1" stop-color="#e0483a"/>
    </linearGradient>
    <linearGradient id="luCardB" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7fb6ff"/><stop offset="1" stop-color="#2f6fd6"/>
    </linearGradient>
    <linearGradient id="luCardY" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffe37f"/><stop offset="1" stop-color="#e0ac2b"/>
    </linearGradient>
    <filter id="luShadow"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".45"/></filter>
  </defs>

  <rect width="640" height="800" rx="72" fill="#0a1a17"/>
  <rect width="640" height="800" rx="72" fill="url(#luBg)"/>
  <circle cx="520" cy="140" r="190" fill="#5ec8a6" opacity=".14"/>
  <circle cx="110" cy="660" r="200" fill="#5ec8a6" opacity=".09"/>

  <g filter="url(#luShadow)" transform="translate(320 330)">
    <g transform="rotate(-16) translate(-150 40)">
      <rect x="-58" y="-92" width="116" height="164" rx="16" fill="url(#luCardR)" stroke="#ffffff" stroke-opacity=".25" stroke-width="3"/>
      <text x="0" y="10" text-anchor="middle" font-family="Georgia,serif" font-size="72" font-weight="700" fill="#fff">4</text>
    </g>
    <g transform="translate(0 10)">
      <rect x="-58" y="-92" width="116" height="164" rx="16" fill="url(#luCardY)" stroke="#ffffff" stroke-opacity=".3" stroke-width="3"/>
      <text x="0" y="10" text-anchor="middle" font-family="Georgia,serif" font-size="72" font-weight="700" fill="#4a3400">7</text>
    </g>
    <g transform="rotate(16) translate(150 40)">
      <rect x="-58" y="-92" width="116" height="164" rx="16" fill="url(#luCardB)" stroke="#ffffff" stroke-opacity=".25" stroke-width="3"/>
      <text x="0" y="10" text-anchor="middle" font-family="Georgia,serif" font-size="72" font-weight="700" fill="#fff">9</text>
    </g>
  </g>

  <text x="320" y="640" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
        font-size="66" font-weight="800" letter-spacing="1" fill="#eafff6">LEVEL<tspan fill="#5ec8a6">UP</tspan></text>
  <text x="320" y="694" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
        font-size="23" font-weight="600" letter-spacing="6" fill="#8fd9c2">10 LEVEL · 2-6 SPIELER</text>
</svg>
