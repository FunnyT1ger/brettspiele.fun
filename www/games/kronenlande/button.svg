<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-label="Kronenlande">
  <defs>
    <linearGradient id="klGold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff8e6"/><stop offset=".5" stop-color="#ffd889"/><stop offset="1" stop-color="#8a6423"/>
    </linearGradient>
    <radialGradient id="klBg" cx="30%" cy="18%" r="95%">
      <stop stop-color="#1c130c00"/><stop offset="1" stop-color="#090705"/>
    </radialGradient>
    <linearGradient id="klTile" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3a2814"/><stop offset="1" stop-color="#1c130c"/>
    </linearGradient>
    <filter id="klShadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-opacity=".55"/></filter>
  </defs>

  <rect width="640" height="800" rx="72" fill="#0d0a06"/>
  <rect width="640" height="800" rx="72" fill="url(#klBg)"/>
  <circle cx="520" cy="150" r="190" fill="#d3a14b" opacity=".12"/>
  <circle cx="120" cy="690" r="220" fill="#8a6423" opacity=".12"/>

  <!-- faint tile grid -->
  <g stroke="#d3a14b" stroke-width="2" opacity=".14">
    <path d="M80 300 h480 M80 400 h480 M80 500 h480"/>
    <path d="M200 240 v320 M320 240 v320 M440 240 v320"/>
  </g>

  <!-- stacked land tiles -->
  <g filter="url(#klShadow)">
    <rect x="150" y="470" width="150" height="150" rx="18" fill="url(#klTile)" stroke="#d3a14b" stroke-width="3" transform="rotate(-8 225 545)"/>
    <rect x="330" y="470" width="150" height="150" rx="18" fill="url(#klTile)" stroke="#d3a14b" stroke-width="3" transform="rotate(7 405 545)"/>
    <rect x="245" y="410" width="150" height="150" rx="18" fill="url(#klTile)" stroke="#ffd889" stroke-width="3"/>
  </g>

  <!-- crown -->
  <g filter="url(#klShadow)" transform="translate(320 260)">
    <path d="M-140 40 L-140 -70 L-70 -10 L0 -95 L70 -10 L140 -70 L140 40 Z"
          fill="url(#klGold)" stroke="#8a6423" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-140" y="40" width="280" height="42" rx="10" fill="url(#klGold)" stroke="#8a6423" stroke-width="4"/>
    <circle cx="-140" cy="-70" r="16" fill="#ffd889" stroke="#8a6423" stroke-width="4"/>
    <circle cx="0" cy="-95" r="18" fill="#ffd889" stroke="#8a6423" stroke-width="4"/>
    <circle cx="140" cy="-70" r="16" fill="#ffd889" stroke="#8a6423" stroke-width="4"/>
    <circle cx="-55" cy="60" r="11" fill="#7c1f2b"/>
    <circle cx="0" cy="60" r="11" fill="#2b5b7c"/>
    <circle cx="55" cy="60" r="11" fill="#2b7c4a"/>
  </g>

  <text x="320" y="720" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="62" font-weight="900" letter-spacing="4" fill="url(#klGold)">KRONENLANDE</text>
</svg>
