<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-label="Goldmeile">
  <defs>
    <linearGradient id="gmBg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#164534"/><stop offset="1" stop-color="#0a1a13"/>
    </linearGradient>
    <radialGradient id="gmCoin" cx="34%" cy="30%" r="75%">
      <stop stop-color="#e6cf88"/><stop offset="0.7" stop-color="#cba650"/><stop offset="1" stop-color="#a07d2b"/>
    </radialGradient>
    <filter id="gmShadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".5"/></filter>
  </defs>

  <rect width="640" height="800" rx="72" fill="#0a1a13"/>
  <rect width="640" height="800" rx="72" fill="url(#gmBg)"/>
  <circle cx="510" cy="150" r="180" fill="#cba650" opacity=".12"/>
  <circle cx="130" cy="680" r="210" fill="#cba650" opacity=".08"/>

  <!-- board frame -->
  <g transform="translate(320 330)" opacity=".9">
    <rect x="-170" y="-170" width="340" height="340" rx="26" fill="none" stroke="#cba650" stroke-width="6" stroke-opacity=".5"/>
    <rect x="-120" y="-120" width="240" height="240" rx="14" fill="none" stroke="#cba650" stroke-width="3" stroke-opacity=".35"/>
    <!-- corner property tokens -->
    <rect x="-170" y="-170" width="60" height="16" rx="4" fill="#c33b34"/>
    <rect x="110" y="-170" width="60" height="16" rx="4" fill="#2c4a9c"/>
    <rect x="-170" y="154" width="60" height="16" rx="4" fill="#2f9257"/>
    <rect x="110" y="154" width="60" height="16" rx="4" fill="#e0862b"/>
  </g>

  <!-- gold coins -->
  <g filter="url(#gmShadow)">
    <circle cx="250" cy="330" r="70" fill="url(#gmCoin)" stroke="#ffffff" stroke-opacity=".22" stroke-width="4"/>
    <circle cx="250" cy="330" r="54" fill="none" stroke="#5a4413" stroke-width="3" stroke-opacity=".5"/>
    <text x="250" y="330" text-anchor="middle" dominant-baseline="central" font-family="'Cinzel',Georgia,serif" font-size="64" font-weight="700" fill="#5a4413">G</text>
  </g>
  <g filter="url(#gmShadow)">
    <circle cx="390" cy="365" r="52" fill="url(#gmCoin)" stroke="#ffffff" stroke-opacity=".22" stroke-width="3"/>
    <text x="390" y="365" text-anchor="middle" dominant-baseline="central" font-family="'Cinzel',Georgia,serif" font-size="46" font-weight="700" fill="#5a4413">G</text>
  </g>

  <text x="320" y="655" text-anchor="middle" font-family="'Cinzel',Georgia,serif"
        font-size="60" font-weight="700" letter-spacing="2" fill="#e6cf88">GOLDMEILE</text>
  <text x="320" y="712" text-anchor="middle" font-family="'Jost',system-ui,sans-serif"
        font-size="24" font-weight="500" letter-spacing="8" fill="#cba650">STRASSEN-HANDEL</text>
</svg>
